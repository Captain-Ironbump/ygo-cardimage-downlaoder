[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ygo_card_downloader"
version = "0.1.0"
description = "Download card images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pathlib==1.0.1", "requests"]

[project.scripts]
ygo-card-downloader = "ygo_card_downloader.main:main"
ygo-card-matcher = "ygo_card_matcher.main:main"

[tool.setuptools.packages.find]
where = ["src"]
